# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

format = """
[ $os $username$hostname](bg:#7755fe fg:white)\
[](fg:#7755fe bg:#769ff0)\
$directory\
[](fg:#769ff0)\
[ $git_branch $git_status]()\
\n[└](fg:#7755fe bold)$character
"""

[custom.foo]
symbol = "R"
format = "[$symbol](bg:red blue)"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[$user]($style)'

[directory]
style = "fg:black bg:#769ff0"
format = "[$path]($style)"
truncation_length = 7
read_only = " 󰌾"
truncation_symbol = "…/"

[character]
success_symbol = '[ \$](bold green)'
error_symbol = '[ \$](bold red)'

[hostname]
ssh_only = false
ssh_symbol = " "
style = "fg:crust"
format = '@(bold)[$ssh_symbol](bold)[$hostname]($style)'
#trim_at = '.companyname.com'
disabled = false

[git_status]
style = "fg:red"

[git_branch]
symbol = " "
style = "fg:red"
format = "[$symbol$branch]($style)"

[time]
disabled = false
time_format = "%R"
style = "fg:black bg:purple"
format = '[  $time]($style)[](fg:purple)'

[fill]
symbol = '─'
style = "fg:lavender"

